[package]
name = "ai-resume-generator-desktop"
version = "1.0.0"
description = "AI Resume Generator 桌面外壳（Tauri 2 + Python sidecar）"
authors = ["Justine"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只访问 http://127.0.0.1，不需要任何 TLS 后端（避免引入 OpenSSL / rustls 编译负担）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
